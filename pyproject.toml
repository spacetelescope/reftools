[build-system]
requires = ["setuptools>=82.0.1",
            "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = [
    "cp39-*",  # build for CPython 3.9 Stable API
    "cp3*t-*",  # build for free-threaded Python
]
test-command = "python -c 'from reftools import _computephotpars'"
